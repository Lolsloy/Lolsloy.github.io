  <style>
    :root{
      --bg:#0E141A;
      --panel:#101820;
      --panel-2:#0b1218;
      --surface:rgba(16,24,32,.72);
      --surface-2:rgba(16,24,32,.52);
      --border:#1f2a35;
      --border-2:#223041;
      --text:#E6E9ED;
      --muted:#9AA4AE;
      --pink:#cf64e5;
      --blue:#00E5FF;
      --violet:#7A5CFF;
      --shadow:0 28px 80px rgba(0,0,0,.55);
      --radius-xl:28px;
      --radius-lg:22px;
      --radius-md:18px;
      --radius-sm:14px;
      --header-h:78px;
      --input-h:78px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,body{
      height:100%;
      overflow:hidden;
    }

    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 10% -10%, rgba(236,72,153,.22), transparent 55%),
        radial-gradient(1100px 720px at 100% 100%, rgba(59,130,246,.22), transparent 58%),
        radial-gradient(900px 520px at 50% 0%, rgba(0,229,255,.12), transparent 60%),
        var(--bg);
      overflow-x:hidden;
      min-height:100vh;
    }

    img{
      max-width:100%;
      display:block;
      height:auto;
    }

    button,
    input{
      font:inherit;
    }

    button{
      border:0;
      background:none;
      color:inherit;
      cursor:pointer;
    }

    :focus-visible{
      outline:3px solid rgba(0,229,255,.45);
      outline-offset:3px;
      border-radius:14px;
    }

    .shell{
      position:relative;
      height:100dvh;
      width:100%;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      display:grid;
      place-items:center;
    }

    .shell::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(700px 380px at 20% 20%, rgba(207,100,229,.10), transparent 60%),
        radial-gradient(700px 420px at 80% 80%, rgba(0,229,255,.08), transparent 60%);
    }

    .chat-app{
      position:relative;
      width:min(1100px, 100%);
      height:min(920px, 100%);
      display:grid;
      grid-template-rows:auto 1fr auto;
      border:1px solid var(--border-2);
      border-radius:32px;
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(236,72,153,.18), transparent 60%),
        radial-gradient(800px 520px at 92% 120%, rgba(59,130,246,.16), transparent 60%),
        rgba(12,18,24,.88);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      overflow:hidden;
    }

    .chat-app::after{
      content:"";
      position:absolute;
      left:-20%;
      top:0;
      width:40%;
      height:3px;
      background:linear-gradient(90deg, rgba(207,100,229,0), rgba(207,100,229,.95), rgba(0,229,255,.95), rgba(255,94,160,.95), rgba(207,100,229,0));
      animation:topScan 1.4s linear infinite;
      pointer-events:none;
      z-index:5;
    }

    @keyframes topScan{
      0%{transform:translateX(0)}
      100%{transform:translateX(350%)}
    }

    .header{
      height:var(--header-h);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:0 18px;
      border-bottom:1px solid #1a2530;
      background:rgba(16,24,32,.76);
      backdrop-filter:blur(12px);
      position:relative;
      z-index:2;
    }

    .header-left{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }

    .logo-wrap{
      width:58px;
      height:58px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(16,24,32,.5);
      display:grid;
      place-items:center;
      overflow:hidden;
      flex:0 0 auto;
    }

    .logo{
      width:42px;
      height:42px;
      transform:translateY(2px);
    }

    .brand-text{
      min-width:0;
    }

    .title{
      font-size:1.25rem;
      font-weight:900;
      line-height:1;
      letter-spacing:.03em;
      color:#fff;
      white-space:nowrap;
    }

    .subtitle{
      margin-top:6px;
      color:var(--muted);
      font-size:.84rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .header-right{
      display:flex;
      align-items:center;
      gap:10px;
      flex:0 0 auto;
    }

    .status{
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 14px;
      height:44px;
      border-radius:999px;
      border:1px solid var(--border);
      background:rgba(16,24,32,.55);
      color:#d9e1e8;
      font-weight:800;
      letter-spacing:.02em;
    }

    .status-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#00ff87;
      box-shadow:0 0 0 6px rgba(0,255,135,.12);
      flex:0 0 auto;
    }

    .messages{
      position:relative;
      overflow-y:auto;
      overflow-x:hidden;
      padding:20px;
      scroll-behavior:smooth;
      -webkit-overflow-scrolling:touch;
      background:
        linear-gradient(180deg, rgba(255,255,255,.01), rgba(255,255,255,0)),
        transparent;
    }

    .messages::before{
      content:"";
      position:sticky;
      top:0;
      display:block;
      height:1px;
    }

    .welcome{
      max-width:720px;
      margin:0 auto 22px;
      padding:22px;
      border:1px solid var(--border-2);
      border-radius:24px;
      background:rgba(16,24,32,.42);
      backdrop-filter:blur(12px);
      box-shadow:0 18px 60px rgba(0,0,0,.25);
    }

    .welcome-top{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:12px;
    }

    .welcome-badge{
      width:48px;
      height:48px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(16,24,32,.55);
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }

    .welcome-badge svg{
      width:32px;
      height:32px;
      transform:translateY(2px);
    }

    .welcome h1{
      font-size:1.3rem;
      font-weight:900;
      letter-spacing:.02em;
      color:#fff;
    }

    .welcome p{
      color:#cfd6dd;
      line-height:1.55;
      font-size:.98rem;
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:16px;
    }

    .chip{
      padding:10px 14px;
      border-radius:999px;
      border:1px solid #2a3641;
      background:rgba(16,24,32,.48);
      color:#e8eef4;
      font-weight:800;
      font-size:.94rem;
      transition:transform .12s ease, filter .12s ease, background .12s ease;
    }

    .chip:hover{
      transform:translateY(-1px);
      filter:brightness(1.06);
      background:rgba(20,30,40,.68);
    }

    .message-row{
      display:flex;
      margin-bottom:16px;
      animation:fadeUp .22s ease;
    }

    .message-row.user{
      justify-content:flex-end;
    }

    .message-row.bot{
      justify-content:flex-start;
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(8px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .message{
      display:flex;
      align-items:flex-end;
      gap:10px;
      max-width:min(78%, 760px);
    }

    .message-row.user .message{
      flex-direction:row-reverse;
    }

    .avatar{
      width:38px;
      height:38px;
      border-radius:14px;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      border:1px solid var(--border);
      background:rgba(16,24,32,.55);
      overflow:hidden;
    }

    .avatar.bot svg{
      width:28px;
      height:28px;
      transform:translateY(2px);
    }

    .avatar.user{
      background:linear-gradient(180deg,#7a3bd0,#572B87);
      color:#fff;
      font-weight:900;
      letter-spacing:.02em;
    }

    .bubble{
      position:relative;
      padding:14px 16px;
      border-radius:20px;
      line-height:1.55;
      font-size:1rem;
      word-break:break-word;
      overflow-wrap:anywhere;
      box-shadow:0 10px 30px rgba(0,0,0,.18);
    }

    .bubble.user{
      background:linear-gradient(180deg,#7a3bd0,#572B87);
      color:#fff;
      border:1px solid rgba(207,100,229,.45);
      border-bottom-right-radius:8px;
    }

    .bubble.bot{
      background:rgba(16,24,32,.68);
      border:1px solid var(--border-2);
      color:#e6edf3;
      border-bottom-left-radius:8px;
      backdrop-filter:blur(10px);
    }

    .bubble.bot img{
      margin-top:10px;
      border-radius:16px;
      border:1px solid #223041;
      max-height:320px;
      object-fit:cover;
    }

    .bubble p + p{
      margin-top:10px;
    }

    .typing{
      display:none;
      align-items:center;
      gap:8px;
      max-width:min(78%, 760px);
      margin-bottom:16px;
    }

    .typing.show{
      display:flex;
    }

    .typing-bubble{
      display:flex;
      align-items:center;
      gap:6px;
      padding:12px 14px;
      border-radius:18px;
      border:1px solid var(--border-2);
      background:rgba(16,24,32,.68);
    }

    .typing-bubble span{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#cfd6dd;
      opacity:.4;
      animation:blink 1.1s infinite ease-in-out;
    }

    .typing-bubble span:nth-child(2){
      animation-delay:.14s;
    }

    .typing-bubble span:nth-child(3){
      animation-delay:.28s;
    }

    @keyframes blink{
      0%, 80%, 100%{
        transform:translateY(0);
        opacity:.35;
      }
      40%{
        transform:translateY(-4px);
        opacity:1;
      }
    }

    .input-area{
      padding:14px 16px calc(14px + env(safe-area-inset-bottom));
      border-top:1px solid #1a2530;
      background:rgba(16,24,32,.76);
      backdrop-filter:blur(12px);
    }

    .composer{
      display:flex;
      align-items:flex-end;
      gap:12px;
      padding:10px;
      border-radius:24px;
      border:1px solid var(--border-2);
      background:rgba(12,18,24,.82);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }

    .input-wrap{
      flex:1;
      min-width:0;
      display:flex;
      align-items:flex-end;
      gap:10px;
      padding:8px 8px 8px 14px;
      border-radius:18px;
      background:rgba(16,24,32,.4);
      border:1px solid rgba(255,255,255,.03);
    }

    #input{
      flex:1;
      min-width:0;
      min-height:24px;
      max-height:140px;
      resize:none;
      border:0;
      outline:0;
      background:transparent;
      color:#fff;
      font-size:1rem;
      line-height:1.45;
      padding:6px 0;
      overflow-y:auto;
    }

    #input::placeholder{
      color:#8fa0ae;
    }

    .send{
      width:56px;
      height:56px;
      border-radius:18px;
      border:1px solid rgba(207,100,229,.65);
      background:linear-gradient(180deg,#7a3bd0,#572B87);
      display:grid;
      place-items:center;
      transition:transform .12s ease, filter .12s ease, opacity .12s ease;
      flex:0 0 auto;
    }

    .send:hover{
      transform:translateY(-1px);
      filter:brightness(1.06);
    }

    .send:disabled{
      opacity:.55;
      cursor:default;
      transform:none;
      filter:none;
    }

    .send svg{
      width:22px;
      height:22px;
      color:#fff;
    }

    .footnote{
      margin-top:10px;
      padding:0 6px;
      color:#8fa0ae;
      font-size:.83rem;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .empty{
      display:none;
      max-width:560px;
      margin:24px auto 0;
      text-align:center;
      color:var(--muted);
    }

    .messages.has-chat .welcome{
      display:none;
    }

    .messages.has-chat .empty{
      display:none;
    }

    [hidden]{
      display:none !important;
    }

    /* 📸 Foto-Upload */
    .attach{
      width:56px;
      height:56px;
      border-radius:18px;
      border:1px solid var(--border-2);
      background:rgba(16,24,32,.55);
      display:grid;
      place-items:center;
      flex:0 0 auto;
      transition:transform .12s ease, filter .12s ease, background .12s ease;
    }

    .attach:hover{
      transform:translateY(-1px);
      background:rgba(20,30,40,.75);
    }

    .attach:disabled{
      opacity:.55;
      cursor:default;
      transform:none;
    }

    .attach svg{
      width:22px;
      height:22px;
      color:#cfd6dd;
    }

    .preview{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:10px;
      padding:8px;
      border-radius:18px;
      border:1px solid var(--border-2);
      background:rgba(12,18,24,.82);
      width:fit-content;
      max-width:100%;
    }

    .preview img{
      width:64px;
      height:64px;
      object-fit:cover;
      border-radius:12px;
    }

    .preview span{
      color:var(--muted);
      font-size:.9rem;
    }

    .preview button{
      width:32px;
      height:32px;
      border-radius:10px;
      border:1px solid var(--border-2);
      font-weight:900;
      color:#cfd6dd;
    }

    .bubble.user img{
      max-width:240px;
      max-height:240px;
      object-fit:cover;
      border-radius:14px;
      margin-bottom:8px;
    }

    /* 🃏 Set-Karten */
    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));
      gap:10px;
      margin-top:12px;
    }

    .card{
      display:flex;
      flex-direction:column;
      border-radius:16px;
      border:1px solid var(--border-2);
      background:rgba(12,18,24,.7);
      overflow:hidden;
    }

    /* Blasen mit Karten immer volle Breite → Karten überall gleich groß */
    .message.with-cards{
      width:100%;
    }

    .message.with-cards .bubble{
      flex:1;
      min-width:0;
    }

    /* Feste Bildbox: jedes Bild gleich groß, egal welches Format */
    .card-img{
      position:relative;
      height:150px;
      background:#fff;
      display:grid;
      place-items:center;
      font-size:2rem;
    }

    .bubble.bot .card-img img{
      position:absolute;
      inset:0;
      margin:0;
      border:0;
      border-radius:0;
      width:100%;
      height:100%;
      max-width:none;
      max-height:none;
      padding:10px;
      object-fit:contain;
    }

    .card-body{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:6px;
      padding:10px 12px 12px;
    }

    .card-name{
      font-weight:800;
      color:#fff;
      line-height:1.3;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
      min-height:2.6em; /* immer Platz für 2 Zeilen → alle Karten gleich hoch */
    }

    .card-meta{
      color:var(--muted);
      font-size:.84rem;
      line-height:1.45;
    }

    .card-btn{
      margin-top:auto;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(207,100,229,.55);
      background:rgba(122,59,208,.25);
      font-weight:800;
      font-size:.88rem;
      transition:background .12s ease;
    }

    .card-btn:hover{
      background:rgba(122,59,208,.45);
    }

    .card-btn:disabled{
      opacity:.55;
      cursor:default;
    }

    /* 🏗️ Eigenes Modell mit Bauanleitung */
    .build{
      margin-top:12px;
      border:1px solid var(--border-2);
      border-radius:16px;
      background:rgba(12,18,24,.7);
      overflow:hidden;
      max-width:520px;
    }

    .build-head{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:8px;
      padding:10px 12px;
      font-weight:800;
      color:#fff;
    }

    .build-head span{
      color:var(--muted);
      font-weight:600;
      font-size:.84rem;
      white-space:nowrap;
    }

    .build-img{
      position:relative;
      height:230px;
      background:#fff;
    }

    .bubble.bot .build-img img{
      position:absolute;
      inset:0;
      margin:0;
      border:0;
      border-radius:0;
      width:100%;
      height:100%;
      max-width:none;
      max-height:none;
      padding:14px;
      object-fit:contain;
      cursor:zoom-in;
    }

    .build-step{
      display:grid;
      gap:10px;
      padding:10px 12px 12px;
      border-top:1px solid var(--border-2);
    }

    .build-step .build-img{
      height:190px;
      border-radius:12px;
      overflow:hidden;
    }

    .build-nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .build-nav span{
      font-weight:800;
      color:#fff;
    }

    .build-nav button{
      width:42px;
      height:34px;
      border-radius:10px;
      border:1px solid rgba(207,100,229,.55);
      background:rgba(122,59,208,.25);
      font-weight:800;
    }

    .build-nav button:disabled{
      opacity:.35;
      cursor:default;
    }

    .build-parts{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }

    .part-chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:4px 9px;
      border-radius:999px;
      background:rgba(255,255,255,.07);
      font-size:.84rem;
    }

    .part-chip i{
      width:12px;
      height:12px;
      border-radius:3px;
      border:1px solid rgba(0,0,0,.4);
    }

    .build-text{
      margin:0;
      line-height:1.45;
    }

    .typing-text{
      color:var(--muted);
      font-size:.9rem;
      line-height:1.4;
    }

    /* 🔍 Bild vergrößern */
    .card-img img,
    .bubble.user img{
      cursor:zoom-in;
    }

    .lightbox{
      position:fixed;
      inset:0;
      z-index:100;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;
      padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom));
      background:rgba(5,8,12,.88);
      backdrop-filter:blur(8px);
      animation:fadeIn .15s ease;
      cursor:zoom-out;
    }

    @keyframes fadeIn{
      from{ opacity:0 }
      to{ opacity:1 }
    }

    .lightbox img{
      max-width:min(1100px, 100%);
      max-height:calc(100% - 70px);
      object-fit:contain;
      border-radius:18px;
      background:#fff;
      box-shadow:0 30px 90px rgba(0,0,0,.6);
      cursor:default;
    }

    .lightbox-caption{
      color:#e6edf3;
      font-weight:800;
      text-align:center;
      max-width:min(900px, 100%);
    }

    .lightbox-close{
      position:absolute;
      top:max(16px, env(safe-area-inset-top));
      right:16px;
      width:46px;
      height:46px;
      border-radius:14px;
      border:1px solid var(--border-2);
      background:rgba(16,24,32,.85);
      color:#fff;
      font-size:1.2rem;
      font-weight:900;
    }

    @media (max-width:980px){
      .chat-app{
        width:100%;
        height:100%;
        border-radius:26px;
      }

      .message{
        max-width:86%;
      }
    }

    @media (max-width:720px){
      .shell{
        padding:0;
      }

      .chat-app{
        width:100%;
        height:100dvh;
        border-radius:0;
        border-left:0;
        border-right:0;
      }

      .header{
        height:72px;
        padding:0 14px;
      }

      .logo-wrap{
        width:50px;
        height:50px;
        border-radius:16px;
      }

      .logo{
        width:36px;
        height:36px;
      }

      .title{
        font-size:1.08rem;
      }

      .subtitle{
        font-size:.76rem;
      }

      .status{
        height:40px;
        padding:0 12px;
        font-size:.86rem;
      }

      .messages{
        padding:14px;
      }

      .welcome{
        padding:18px;
        border-radius:22px;
      }

      .welcome h1{
        font-size:1.15rem;
      }

      .chips{
        gap:8px;
      }

      .chip{
        font-size:.88rem;
        padding:9px 12px;
      }

      .message{
        max-width:94%;
        gap:8px;
      }

      .avatar{
        width:34px;
        height:34px;
        border-radius:12px;
      }

      .bubble{
        padding:12px 14px;
        font-size:.96rem;
        border-radius:18px;
      }

      .input-area{
        padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      }

      .composer{
        gap:10px;
        padding:8px;
        border-radius:20px;
      }

      .send,
      .attach{
        width:50px;
        height:50px;
        border-radius:16px;
      }

      .cards{
        grid-template-columns:repeat(2, minmax(0, 1fr));
      }

      .card-img{
        height:120px;
      }

      .footnote{
        font-size:.78rem;
      }
    }

    @media (max-width:480px){
      .header-right .status{
        padding:0 10px;
        font-size:.78rem;
      }

      .status-text{
        display:none;
      }

      .message{
        max-width:100%;
      }

      .bubble.bot img{
        max-height:240px;
      }

      .welcome-top{
        align-items:center;
      }

      .welcome-badge{
        width:42px;
        height:42px;
        border-radius:14px;
      }

      .welcome-badge svg{
        width:28px;
        height:28px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      .chat-app::after,
      .typing-bubble span,
      .message-row{
        animation:none;
      }

      .messages{
        scroll-behavior:auto;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="chat-app">
      <header class="header">
        <div class="header-left">
          <div class="logo-wrap" aria-hidden="true">
            <svg class="logo" viewBox="0 0 3326 2408" preserveAspectRatio="xMidYMid meet">
              <use href="#sethub-logo"></use>
            </svg>
          </div>

          <div class="brand-text">
            <div class="title">SetHub AI</div>
            <div class="subtitle">LEGO Assistant</div>
          </div>
        </div>

        <div class="header-right">
          <div class="status" aria-label="Status">
            <span class="status-dot"></span>
            <span class="status-text">Online</span>
          </div>
        </div>
      </header>

      <main id="messages" class="messages">
        <section class="welcome">
          <div class="welcome-top">
            <div class="welcome-badge" aria-hidden="true">
              <svg viewBox="0 0 3326 2408" preserveAspectRatio="xMidYMid meet">
                <use href="#sethub-logo"></use>
              </svg>
            </div>
            <h1>Frag mich etwas über LEGO</h1>
          </div>

          <p>
            News, Sets, Preise, Verfügbarkeit oder Ideen für deine Sammlung.
          </p>

          <div class="chips">
            <button class="chip" type="button" data-prompt="Welche neuen LEGO Sets sind gerade interessant?">Neue Sets</button>
            <button class="chip" type="button" data-prompt="Gib mir gute LEGO Geschenkideen">Geschenkideen</button>
            <button class="chip" type="button" data-prompt="Welche LEGO Themen sind gerade beliebt?">Beliebte Themen</button>
            <button class="chip" type="button" data-prompt="Hilf mir beim Aufbau meiner Wunschliste">Wunschliste</button>
            <button class="chip" type="button" data-prompt="Mach ein LEGO-Quiz mit mir!">🎯 Quiz</button>
            <button class="chip" type="button" data-prompt="Zeig mir ein zufälliges cooles Set!">🎲 Zufallsset</button>
            <button class="chip" type="button" data-action="photo">📸 Foto erkennen</button>
            <button class="chip" type="button" data-prompt="Ich habe ein paar LEGO Steine – was kann ich daraus bauen?">🏗️ Was kann ich bauen?</button>
          </div>
        </section>

        <div class="typing" id="typing">
          <div class="avatar bot" aria-hidden="true">
            <svg viewBox="0 0 3326 2408" preserveAspectRatio="xMidYMid meet">
              <use href="#sethub-logo"></use>
            </svg>
          </div>
          <div class="typing-bubble" aria-label="Schreibt">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="typing-text" id="typingText" hidden></div>
        </div>

        <div class="empty" id="empty">
          Noch keine Nachrichten
        </div>
      </main>

      <div class="input-area">
        <div class="preview" id="preview" hidden>
          <img id="previewImg" alt="Ausgewähltes Foto">
          <span>Foto bereit</span>
          <button id="previewRemove" type="button" aria-label="Foto entfernen">✕</button>
        </div>

        <div class="composer">
          <button id="attach" class="attach" type="button" aria-label="Foto hochladen">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.4-2h5l1.4 2h1.6A2.5 2.5 0 0 1 20 8.5v9A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="12" cy="13" r="3.5" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
          <input id="fileInput" type="file" accept="image/*" hidden>

          <div class="input-wrap">
            <textarea
              id="input"
              rows="1"
              placeholder="Frage über LEGO eingeben"
              enterkeyhint="send"
              autocomplete="off"
              autocapitalize="sentences"
              spellcheck="false"
            ></textarea>
          </div>

          <button id="send" class="send" type="button" aria-label="Senden">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12.5 20 4l-5.2 16-2.9-5.4L4 12.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M20 4 11.9 14.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div class="footnote">
          <span>SetHub Design</span>
          <span>Responsive Chat UI</span>
        </div>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Bild vergrößert">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Schließen">✕</button>
    <img id="lightboxImg" alt="">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <script>
    const messagesDiv = document.getElementById("messages")
    const input = document.getElementById("input")
    const send = document.getElementById("send")
    const typing = document.getElementById("typing")
    const chips = document.querySelectorAll(".chip")
    const attach = document.getElementById("attach")
    const fileInput = document.getElementById("fileInput")
    const preview = document.getElementById("preview")
    const previewImg = document.getElementById("previewImg")
    const previewRemove = document.getElementById("previewRemove")

    let busy = false
    let pendingImage = null // Data-URL des ausgewählten Fotos

    // 🧠 Eine ID pro Chat, damit sich der Bot an das Gespräch erinnert
    const sessionId = (crypto.randomUUID && crypto.randomUUID()) ||
      (Date.now().toString(36) + Math.random().toString(36).slice(2))

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;")
    }

    function autoResizeTextarea() {
      input.style.height = "auto"
      input.style.height = Math.min(input.scrollHeight, 140) + "px"
    }

    function scrollToBottom(force = false) {
      messagesDiv.scrollTo({
        top: messagesDiv.scrollHeight,
        behavior: force ? "auto" : "smooth"
      })
    }

    function createAvatar(role) {
      const avatar = document.createElement("div")
      avatar.className = "avatar " + role

      if (role === "bot") {
        avatar.innerHTML = `
          <svg viewBox="0 0 3326 2408" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <use href="#sethub-logo"></use>
          </svg>
        `
      } else {
        avatar.textContent = "Du"
      }

      return avatar
    }

    function appendRow(role, bubble, extraClass = "") {
      messagesDiv.classList.add("has-chat")

      const row = document.createElement("div")
      row.className = "message-row " + role

      const message = document.createElement("div")
      message.className = ("message " + extraClass).trim()
      message.appendChild(createAvatar(role))
      message.appendChild(bubble)
      row.appendChild(message)

      messagesDiv.insertBefore(row, typing)
      scrollToBottom()
    }

    function addUserMessage(text, image) {
      const bubble = document.createElement("div")
      bubble.className = "bubble user"

      if (image) {
        const img = document.createElement("img")
        img.src = image
        img.alt = "Dein Foto"
        bubble.appendChild(img)
      }
      if (text) {
        const p = document.createElement("div")
        p.textContent = text
        bubble.appendChild(p)
      }

      appendRow("user", bubble)
    }

    // 🃏 Set-Karte bauen
    function createCard(set) {
      const card = document.createElement("div")
      card.className = "card"
      card.dataset.setNum = set.set_num

      const imgOk = set.image_url && /^https:\/\//.test(set.image_url)
      const meta = [
        `#${escapeHtml(set.set_num)}${set.year ? " · " + escapeHtml(set.year) : ""}`,
        set.num_parts != null ? `🧱 ${escapeHtml(set.num_parts)} Teile` : "",
        set.minifig_count != null ? `🙂 ${escapeHtml(set.minifig_count)} Figuren` : "",
        set.theme ? escapeHtml(set.theme) : ""
      ].filter(Boolean).join("<br>")

      card.innerHTML = `
        <div class="card-img">
          ${imgOk ? `<img src="${escapeHtml(set.image_url)}" loading="lazy" alt="${escapeHtml(set.name)}">` : "🧱"}
        </div>
        <div class="card-body">
          <div class="card-name">${escapeHtml(set.name)}</div>
          <div class="card-meta">${meta}</div>
          <button class="card-btn" type="button">Mehr Infos</button>
        </div>
      `

      // Bild kaputt → ordentlicher Platzhalter statt Alt-Text
      const cardImg = card.querySelector(".card-img img")
      if (cardImg) {
        cardImg.addEventListener("error", () => {
          cardImg.parentElement.textContent = "🧱"
        })
      }

      card.querySelector(".card-btn").addEventListener("click", () => {
        sendMessage(`Erzähl mir mehr über das Set ${set.set_num}`)
      })

      return card
    }

    // 🏗️ Eigenes Modell als LEGO-Bild zeichnen (schräg von oben, mit Noppen)
    const ISO_S = 22
    const ISO_H = ISO_S * 0.4 // Höhe einer Platte

    function isoPt(x, y, z) {
      return [(x - y) * ISO_S * 0.866, (x + y) * ISO_S * 0.5 - z * ISO_H]
    }

    function shade(hex, f) { // f > 0 heller, f < 0 dunkler
      const n = parseInt(String(hex).slice(1), 16) || 0
      const t = f > 0 ? 255 : 0
      const a = Math.abs(f)
      const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (t - v) * a))
      return `rgb(${c.join(",")})`
    }

    function renderBuildSvg(build, step, highlight) {
      const pieces = build.pieces.filter(p => p.step <= step)
      const cells = new Map()
      pieces.forEach((p, i) => {
        for (let x = p.x; x < p.x + p.w; x++)
          for (let y = p.y; y < p.y + p.l; y++)
            for (let z = p.z; z < p.z + p.h; z++) cells.set(`${x},${y},${z}`, i)
      })

      // Rahmen aus dem fertigen Modell, damit das Bild zwischen den Schritten nicht springt
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
      for (const p of build.pieces) {
        for (const [x, y, z] of [[p.x, p.y, p.z], [p.x + p.w, p.y, p.z], [p.x, p.y + p.l, p.z], [p.x + p.w, p.y + p.l, p.z], [p.x, p.y, p.z + p.h + 1]]) {
          const [sx, sy] = isoPt(x, y, z)
          minX = Math.min(minX, sx); maxX = Math.max(maxX, sx)
          minY = Math.min(minY, sy); maxY = Math.max(maxY, sy)
        }
      }

      const poly = pts => pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")
      const items = []
      for (const [key, i] of cells) {
        const [x, y, z] = key.split(",").map(Number)
        const p = pieces[i]
        const isNew = highlight && p.step === step
        const base = highlight && !isNew ? shade(p.color, 0.0) : p.color
        const fade = highlight && !isNew ? 0.4 : 0
        const top = fade ? shade(p.color, 0.15 + fade * 0.6) : shade(base, 0.15)
        const right = fade ? shade(p.color, fade * 0.6) : shade(base, -0.12)
        const left = fade ? shade(p.color, fade * 0.45) : shade(base, -0.3)
        const edge = isNew ? "#111" : shade(p.color, -0.55)
        const ew = isNew ? 1.4 : 0.7
        const same = (dx, dy, dz) => cells.get(`${x + dx},${y + dy},${z + dz}`) === i
        const occ = (dx, dy, dz) => cells.has(`${x + dx},${y + dy},${z + dz}`)
        const line = (a, b) => `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${edge}" stroke-width="${ew}" stroke-linecap="round"/>`
        const face = (P, fill, edges) => {
          let s = `<polygon points="${poly(P)}" fill="${fill}" stroke="${fill}" stroke-width="0.6" stroke-linejoin="round"/>`
          edges.forEach((show, k) => { if (show) s += line(P[k], P[(k + 1) % 4]) })
          return s
        }

        let svg = ""
        if (!occ(0, 0, 1)) {
          svg += face(
            [isoPt(x, y, z + 1), isoPt(x + 1, y, z + 1), isoPt(x + 1, y + 1, z + 1), isoPt(x, y + 1, z + 1)],
            top,
            [!same(0, -1, 0), !same(1, 0, 0), !same(0, 1, 0), !same(-1, 0, 0)]
          )
        }
        if (!occ(1, 0, 0)) {
          svg += face(
            [isoPt(x + 1, y, z), isoPt(x + 1, y + 1, z), isoPt(x + 1, y + 1, z + 1), isoPt(x + 1, y, z + 1)],
            right,
            [!same(0, 0, -1), !same(0, 1, 0), !same(0, 0, 1), !same(0, -1, 0)]
          )
        }
        if (!occ(0, 1, 0)) {
          svg += face(
            [isoPt(x, y + 1, z), isoPt(x + 1, y + 1, z), isoPt(x + 1, y + 1, z + 1), isoPt(x, y + 1, z + 1)],
            left,
            [!same(0, 0, -1), !same(1, 0, 0), !same(0, 0, 1), !same(-1, 0, 0)]
          )
        }
        if (svg) items.push({ k: x + y + z, svg })

        // Noppe obendrauf
        if (!p.tile && z === p.z + p.h - 1 && !occ(0, 0, 1)) {
          const [cx, cy] = isoPt(x + 0.5, y + 0.5, z + 1)
          const rx = ISO_S * 0.3 * 1.22
          const ry = ISO_S * 0.3 * 0.707
          const sh = ISO_H * 0.5
          items.push({
            k: x + y + z + 1.5,
            svg:
              `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="${left}"/>` +
              `<rect x="${(cx - rx).toFixed(1)}" y="${(cy - sh).toFixed(1)}" width="${(2 * rx).toFixed(1)}" height="${sh.toFixed(1)}" fill="${right}"/>` +
              `<ellipse cx="${cx.toFixed(1)}" cy="${(cy - sh).toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="${top}" stroke="${edge}" stroke-width="${(ew * 0.7).toFixed(2)}"/>`
          })
        }
      }
      items.sort((a, b) => a.k - b.k)

      const pad = 8
      const vb = [minX - pad, minY - pad, maxX - minX + 2 * pad, maxY - minY + 2 * pad].map(v => v.toFixed(1)).join(" ")
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${(maxX - minX + 2 * pad) * 2}" height="${(maxY - minY + 2 * pad) * 2}">${items.map(it => it.svg).join("")}</svg>`
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg)
    }

    const BUILD_TEXT = {
      de: { steps: "Bauanleitung", step: (i, n) => `Schritt ${i} von ${n}`, pieces: n => `${n} Teile`, prev: "Zurück", next: "Weiter" },
      en: { steps: "Instructions", step: (i, n) => `Step ${i} of ${n}`, pieces: n => `${n} pieces`, prev: "Back", next: "Next" }
    }

    function createBuild(build) {
      const T = BUILD_TEXT[build.lang] || BUILD_TEXT.de
      const total = build.steps.length
      const box = document.createElement("div")
      box.className = "build"
      box.innerHTML = `
        <div class="build-head">🏗️ ${escapeHtml(build.name)}<span>${escapeHtml(T.pieces(build.total))}</span></div>
        <div class="build-img"><img alt="${escapeHtml(build.name)}"></div>
        <div class="build-step">
          <div class="build-nav">
            <button type="button" data-dir="-1" aria-label="${T.prev}">◀</button>
            <span></span>
            <button type="button" data-dir="1" aria-label="${T.next}">▶</button>
          </div>
          <div class="build-img"><img alt=""></div>
          <div class="build-parts"></div>
          <p class="build-text"></p>
        </div>
      `
      box.querySelector(".build-img img").src = renderBuildSvg(build, total, false)

      const label = box.querySelector(".build-nav span")
      const stepImg = box.querySelector(".build-step img")
      const parts = box.querySelector(".build-parts")
      const text = box.querySelector(".build-text")
      const [prev, next] = box.querySelectorAll(".build-nav button")
      let current = 1

      function show(n) {
        current = Math.max(1, Math.min(total, n))
        const s = build.steps[current - 1]
        label.textContent = T.step(current, total)
        stepImg.src = renderBuildSvg(build, current, true)
        stepImg.alt = `${build.name} · ${T.step(current, total)}`
        parts.innerHTML = s.parts
          .map(p => `<span class="part-chip"><i style="background:${escapeHtml(p.color)}"></i>${p.count}× ${escapeHtml(p.label)} (${escapeHtml(p.color_name)})</span>`)
          .join("")
        text.textContent = s.text
        prev.disabled = current === 1
        next.disabled = current === total
      }
      prev.addEventListener("click", () => show(current - 1))
      next.addEventListener("click", () => show(current + 1))
      show(1)
      return box
    }

    function addBotMessage(html, cards = [], build = null) {
      const bubble = document.createElement("div")
      bubble.className = "bubble bot"
      bubble.innerHTML = html

      if (cards.length) {
        const grid = document.createElement("div")
        grid.className = "cards"
        cards.forEach(c => grid.appendChild(createCard(c)))
        bubble.appendChild(grid)
      }

      if (build && Array.isArray(build.pieces) && build.steps?.length) {
        try {
          bubble.appendChild(createBuild(build))
        } catch (err) {
          console.error("Modell konnte nicht gezeichnet werden", err)
        }
      }

      appendRow("bot", bubble, cards.length || build ? "with-cards" : "")
    }

    const typingText = document.getElementById("typingText")

    function setTyping(show, text = "") {
      typing.classList.toggle("show", show)
      typingText.textContent = text
      typingText.hidden = !show || !text
      if (show) scrollToBottom()
    }

    function setBusy(state) {
      busy = state
      send.disabled = state
      attach.disabled = state
      input.disabled = state
      document.querySelectorAll(".card-btn").forEach(b => (b.disabled = state))
    }

    // 📸 Foto verkleinern (max 1024px), damit es schnell hochlädt
    function resizeImage(file, maxSize = 1024) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file)
        const img = new Image()
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height))
          const canvas = document.createElement("canvas")
          canvas.width = Math.round(img.width * scale)
          canvas.height = Math.round(img.height * scale)
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height)
          URL.revokeObjectURL(url)
          resolve(canvas.toDataURL("image/jpeg", 0.85))
        }
        img.onerror = () => {
          URL.revokeObjectURL(url)
          reject(new Error("Bild konnte nicht geladen werden"))
        }
        img.src = url
      })
    }

    function setPendingImage(dataUrl) {
      pendingImage = dataUrl
      preview.hidden = !dataUrl
      previewImg.src = dataUrl || ""
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0]
      fileInput.value = ""
      if (!file) return
      try {
        setPendingImage(await resizeImage(file))
        input.focus()
      } catch {
        addBotMessage("Das Foto konnte ich leider nicht öffnen. Probier ein anderes!")
      }
    })

    attach.addEventListener("click", () => fileInput.click())
    previewRemove.addEventListener("click", () => setPendingImage(null))

    async function sendMessage(prefill = null) {
      if (busy) return

      const msg = (prefill ?? input.value).trim()
      const image = prefill ? null : pendingImage
      if (!msg && !image) return

      setBusy(true)
      addUserMessage(msg, image)

      if (!prefill) {
        input.value = ""
        setPendingImage(null)
      }
      autoResizeTextarea()
      const wantsBuild = /\b(ich ha(b|be)|i have|i got)\b.*\b(steine?|bricks?|platten?|plates?)\b|\b(bau(en)?|build)\b.*\b(steine?|bricks?)\b/i.test(msg)
      setTyping(
        true,
        image ? "📸 Ich vergleiche dein Foto mit vielen Sets – das dauert ca. 20–30 Sekunden…"
          : wantsBuild ? "🏗️ Ich tüftle ein Modell aus deinen Steinen aus – das dauert ca. 20–40 Sekunden…"
          : ""
      )

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg, sessionId, image })
        })

        let data
        try {
          data = await res.json()
        } catch {
          data = {}
        }

        setTyping(false)

        if (!res.ok) {
          addBotMessage(escapeHtml(data.error || "Es ist ein Fehler aufgetreten."))
        } else {
          addBotMessage(data.reply || "Keine Antwort erhalten.", data.cards || [], data.build || null)
        }
      } catch {
        setTyping(false)
        addBotMessage("Verbindung fehlgeschlagen.")
      }

      setBusy(false)
      input.focus()
    }

    // 🔍 Bild vergrößern: Klick auf Kartenbild oder eigenes Foto
    const lightbox = document.getElementById("lightbox")
    const lightboxImg = document.getElementById("lightboxImg")
    const lightboxCaption = document.getElementById("lightboxCaption")
    const lightboxClose = document.getElementById("lightboxClose")

    function openLightbox(src, caption) {
      lightboxImg.src = src
      lightboxImg.alt = caption || "Bild"
      lightboxCaption.textContent = caption || ""
      lightbox.hidden = false
      lightboxClose.focus()
    }

    function closeLightbox() {
      lightbox.hidden = true
      lightboxImg.src = ""
    }

    messagesDiv.addEventListener("click", e => {
      const img = e.target.closest(".card-img img, .bubble.user img, .build-img img")
      if (!img) return
      const card = img.closest(".card")
      const caption = card
        ? `${card.querySelector(".card-name")?.textContent || ""} · ${card.dataset.setNum || ""}`
        : img.closest(".build") ? img.alt : "Dein Foto"
      openLightbox(img.src, caption)
    })

    lightbox.addEventListener("click", e => {
      if (e.target !== lightboxImg) closeLightbox()
    })
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && !lightbox.hidden) closeLightbox()
    })

    send.addEventListener("click", () => sendMessage())

    input.addEventListener("input", autoResizeTextarea)

    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault()
        sendMessage()
      }
    })

    chips.forEach(chip => {
      chip.addEventListener("click", () => {
        if (chip.dataset.action === "photo") return fileInput.click()
        sendMessage(chip.dataset.prompt || "")
      })
    })

    autoResizeTextarea()
    scrollToBottom(true)
  </script>

</body>
</html>
